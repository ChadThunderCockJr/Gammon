[package]
name = "cash-out-router"
version = "0.1.0"
edition = "2021"
authors = ["Backgammon Platform"]
description = "Single-purpose verUSD cash-out router for Gammon"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cosmwasm-std = "=2.1.4"
cosmwasm-schema = "=2.1.4"
cw-storage-plus = "=2.0.0"
cw2 = "=2.0.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
