app = "gammon-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  FUNDS_MODE = "free"
  ALLOWED_ORIGINS = "https://gammon.nyc"
  AUTH_CHAIN_ID = "xion-testnet-2"

[deploy]
  release_command = "node dist/migrate.js"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    hard_limit = 2500
    soft_limit = 2000


[checks]
  [checks.ready]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/ready"
    port = 3001
    timeout = "5s"
    type = "http"
